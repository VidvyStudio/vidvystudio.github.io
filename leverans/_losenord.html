<!DOCTYPE html>
<!--
    Lösenordsrutan som visas innan en leveranssida öppnas. Används av StatiCrypt
    via leverans/_verktyg/ny_leverans.py. Filen börjar med _ så att den inte publiceras.
-->
<html lang="sv" class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>/*[|template_title|]*/0</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow" />

        <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="stylesheet" href="/fonts/fonts.css" />
        <style>
            :root {
                --green: #2D5F3F;
                --green-light: #4A8B5C;
                --green-bright: #6FCF97;
                --black: #0A0A0A;
                --gray: #333333;
                --gray-light: #666666;
                --white: #FAFAFA;
                --accent: #E8F5E9;
            }

            * {
                box-sizing: border-box;
            }

            .staticrypt-html,
            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-body {
                font-family: 'DM Sans', sans-serif;
                background: var(--black);
                color: var(--black);
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-content {
                position: relative;
                min-height: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 3rem 16px;
                background:
                    linear-gradient(180deg, rgba(10, 10, 10, 0.25) 0%, rgba(10, 10, 10, 0.55) 100%),
                    url('/hero-dimhav.jpg') center / cover no-repeat;
            }

            .staticrypt-form {
                width: 100%;
                max-width: 420px;
                padding: 2.75rem 2.5rem 2.25rem;
                background: var(--white);
                box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
            }

            .vidvy-logo {
                display: block;
                margin-bottom: 2rem;
                color: var(--green);
                font-size: 1.35rem;
                font-weight: 700;
                letter-spacing: -0.02em;
                text-decoration: none;
            }

            .vidvy-eyebrow {
                margin: 0 0 0.6rem;
                color: var(--green);
                font-size: 0.78rem;
                font-weight: 700;
                letter-spacing: 0.15em;
                text-transform: uppercase;
            }

            .staticrypt-title {
                margin: 0 0 0.6rem;
                font-size: 1.9rem;
                line-height: 1.15;
                letter-spacing: -0.02em;
            }

            .staticrypt-instructions-text {
                margin: 0 0 1.75rem;
                color: var(--gray);
                line-height: 1.6;
            }

            .staticrypt-password-container {
                position: relative;
                margin-bottom: 1rem;
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                width: 100%;
                padding: 1rem 3rem 1rem 1rem;
                border: 1px solid rgba(45, 95, 63, 0.25);
                border-radius: 2px;
                background: #FFFFFF;
                font-family: inherit;
                font-size: 16px;
                color: var(--black);
                outline: none;
                transition: border-color 0.2s ease, box-shadow 0.2s ease;
            }

            .staticrypt-form input[type="password"]:focus,
            .staticrypt-form input[type="text"]:focus {
                border-color: var(--green);
                box-shadow: 0 0 0 3px rgba(111, 207, 151, 0.35);
            }

            .staticrypt-toggle-password-visibility {
                position: absolute;
                top: 50%;
                right: 0.35rem;
                width: 20px;
                height: 20px;
                padding: 12px;
                box-sizing: content-box;
                transform: translateY(-50%);
                opacity: 0.5;
                cursor: pointer;
            }

            .staticrypt-error {
                margin: -0.25rem 0 1rem;
                color: #A13A2A;
                font-size: 0.92rem;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                gap: 0.65rem;
                margin-bottom: 1.4rem;
                color: var(--gray);
                font-size: 0.93rem;
                cursor: pointer;
            }

            .staticrypt-remember input[type="checkbox"] {
                width: 18px;
                height: 18px;
                margin: 0;
                accent-color: var(--green);
            }

            .staticrypt-decrypt-button {
                width: 100%;
                padding: 1.05rem 2rem;
                border: 0;
                border-radius: 2px;
                background: var(--green);
                color: var(--white);
                font-family: inherit;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                transition: background 0.2s ease, transform 0.2s ease;
            }

            .staticrypt-decrypt-button:hover,
            .staticrypt-decrypt-button:focus-visible {
                background: var(--green-light);
            }

            .staticrypt-decrypt-button:focus-visible {
                outline: 2px solid var(--green-bright);
                outline-offset: 3px;
            }

            .vidvy-help {
                margin: 1.6rem 0 0;
                padding-top: 1.25rem;
                border-top: 1px solid rgba(45, 95, 63, 0.14);
                color: var(--gray-light);
                font-size: 0.9rem;
                line-height: 1.6;
            }

            .vidvy-help a {
                color: var(--green);
                font-weight: 500;
            }

            .vidvy-foot {
                margin-top: 1.5rem;
                color: rgba(255, 255, 255, 0.8);
                font-size: 0.85rem;
                text-align: center;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--white);
            }

            .staticrypt-spinner {
                width: 2rem;
                height: 2rem;
                border: 0.25em solid var(--green);
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media (max-width: 480px) {
                .staticrypt-form {
                    padding: 2.25rem 1.5rem 1.75rem;
                }

                .staticrypt-title {
                    font-size: 1.6rem;
                }
            }
        </style>
    </head>

            <p class="vidvy-foot">Vidvy Studio · Drönarfilm &amp; flygfoto i Stockholm</p>

        <script>
            // Fylls i av StatiCrypt när sidan skapas. Formatet är '/*[|variabelnamn|]*/0'.
            const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
            const templateError = "/*[|template_error|]*/0",
                templateToggleAltShow = "/*[|template_toggle_show|]*/0",
                templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
                isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
                staticryptConfig = /*[|staticrypt_config|]*/ 0;

            const templateConfig = {
                rememberExpirationKey: "staticrypt_expiration",
                rememberPassphraseKey: "staticrypt_passphrase",
                replaceHtmlCallback: null,
                clearLocalStorageCallback: null,
            };

            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            window.onload = async function () {
                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();

                if (!isSuccessful) {
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();

                    if (isRememberEnabled) {
                        document.getElementById("staticrypt-remember-label").classList.remove("hidden");
                    }
                }
            };

            const toggleIcon = document.querySelector(".staticrypt-toggle-password-visibility");
            const imgSrcEyeClosed = toggleIcon.src;
            const imgSrcEyeOpened =

            toggleIcon.addEventListener("click", function () {
                const passwordInput = document.getElementById("staticrypt-password");
                const show = passwordInput.type === "password";
                passwordInput.type = show ? "text" : "password";
                toggleIcon.src = show ? imgSrcEyeOpened : imgSrcEyeClosed;
                toggleIcon.alt = toggleIcon.title = show ? templateToggleAltHide : templateToggleAltShow;
            });

            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();
                const errorText = document.getElementById("staticrypt-error");
                errorText.classList.add("hidden");

                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                if (!isSuccessful) {
                    errorText.classList.remove("hidden");
                    document.getElementById("staticrypt-password").select();
                }
            });
        </script>
    </body>
</html>
